name: build-security-deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: bun run check

      - name: Audit Bun dependencies
        run: bun audit

      - name: Validate release build configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: |
          if [ -z "${VITE_LIFF_ID}" ]; then
            echo "Missing required repository variable: VITE_LIFF_ID" >&2
            exit 1
          fi

      - name: Scan repository with containerized Trivy
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace" \
            --volume trivy-cache:/root/.cache/trivy \
            --workdir /workspace \
            "${TRIVY_IMAGE}" fs \
            --skip-version-check \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs node_modules \
            --skip-dirs dist \
            .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short

      - name: Export image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: notice-manager:scan-${{ github.sha }}
          build-args: |
            VITE_LIFF_ID=${{ vars.VITE_LIFF_ID }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Trivy image report
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}:/workspace" \
            --volume trivy-cache:/root/.cache/trivy \
            --workdir /workspace \
            "${TRIVY_IMAGE}" image \
            --image-src docker \
            --skip-version-check \
            --scanners vuln,secret \
            --format sarif \
            --output /workspace/trivy-image.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            "notice-manager:scan-${{ github.sha }}"

      - name: Upload Trivy report
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container

      - name: Enforce Trivy image policy
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/trivy \
            "${TRIVY_IMAGE}" image \
            --image-src docker \
            --skip-version-check \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "notice-manager:scan-${{ github.sha }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LIFF_ID=${{ vars.VITE_LIFF_ID }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  deploy:
    runs-on: self-hosted
    needs: [build]
    if: github.event_name != 'pull_request'
    concurrency:
      group: notice-manager-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read

    env:
      CONTAINER_NAME: notice-manager
      DEPLOY_PLATFORM: linux/arm64
      HOST_PORT: ${{ vars.PORT || '3000' }}
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      BASE_URL: ${{ vars.BASE_URL }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      SESSION_DAYS: ${{ vars.SESSION_DAYS || '30' }}
      EXTERNAL_API_RATE_LIMIT: ${{ vars.EXTERNAL_API_RATE_LIMIT || '60' }}
      RETENTION_WEBHOOK_EVENTS_DAYS: ${{ vars.RETENTION_WEBHOOK_EVENTS_DAYS || '30' }}
      RETENTION_DELIVERIES_DAYS: ${{ vars.RETENTION_DELIVERIES_DAYS || '90' }}
      RETENTION_AUDIT_LOGS_DAYS: ${{ vars.RETENTION_AUDIT_LOGS_DAYS || '365' }}
      RETENTION_EXPIRED_SESSIONS_DAYS: ${{ vars.RETENTION_EXPIRED_SESSIONS_DAYS || '7' }}
      RETENTION_RATE_LIMIT_BUCKETS_DAYS: ${{ vars.RETENTION_RATE_LIMIT_BUCKETS_DAYS || '2' }}
      RETENTION_BATCH_SIZE: ${{ vars.RETENTION_BATCH_SIZE || '1000' }}
      TZ: ${{ vars.TZ || 'Asia/Bangkok' }}

    steps:
      - name: Validate deployment configuration
        env:
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: |
          for name in DATABASE_URL CREDENTIAL_ENCRYPTION_KEY PUBLIC_BASE_URL LINE_LOGIN_CHANNEL_ID VITE_LIFF_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required deployment setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Log in to GHCR
        run: printf '%s' '${{ secrets.GITHUB_TOKEN }}' | container registry login --username '${{ github.actor }}' --password-stdin ghcr.io

      - name: Pull verified image
        run: container image pull --platform "${DEPLOY_PLATFORM}" "${IMAGE_REF}"

      - name: Replace application container
        env:
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_ADMIN_USER_IDS: ${{ secrets.LINE_ADMIN_USER_IDS }}
        run: |
          container stop "${CONTAINER_NAME}" || true
          container delete "${CONTAINER_NAME}" || true
          container run --detach \
            --platform "${DEPLOY_PLATFORM}" \
            --name "${CONTAINER_NAME}" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e BASE_URL="${BASE_URL}" \
            -e PUBLIC_BASE_URL="${PUBLIC_BASE_URL}" \
            -e CORS_ORIGINS="${CORS_ORIGINS}" \
            -e LOG_LEVEL="${LOG_LEVEL}" \
            -e TZ="${TZ}" \
            -e LINE_LOGIN_CHANNEL_ID="${LINE_LOGIN_CHANNEL_ID}" \
            -e LINE_ADMIN_USER_IDS="${LINE_ADMIN_USER_IDS}" \
            -e SESSION_DAYS="${SESSION_DAYS}" \
            -e EXTERNAL_API_RATE_LIMIT="${EXTERNAL_API_RATE_LIMIT}" \
            -e RETENTION_WEBHOOK_EVENTS_DAYS="${RETENTION_WEBHOOK_EVENTS_DAYS}" \
            -e RETENTION_DELIVERIES_DAYS="${RETENTION_DELIVERIES_DAYS}" \
            -e RETENTION_AUDIT_LOGS_DAYS="${RETENTION_AUDIT_LOGS_DAYS}" \
            -e RETENTION_EXPIRED_SESSIONS_DAYS="${RETENTION_EXPIRED_SESSIONS_DAYS}" \
            -e RETENTION_RATE_LIMIT_BUCKETS_DAYS="${RETENTION_RATE_LIMIT_BUCKETS_DAYS}" \
            -e RETENTION_BATCH_SIZE="${RETENTION_BATCH_SIZE}" \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e CREDENTIAL_ENCRYPTION_KEY="${CREDENTIAL_ENCRYPTION_KEY}" \
            -p "${HOST_PORT}:3000" \
            "${IMAGE_REF}"

      - name: Verify deployment health
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${HOST_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          container logs "${CONTAINER_NAME}" || true
          exit 1

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Container image

            - `${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}`
            - Digest: `${{ needs.build.outputs.digest }}`
            - Commit: `${{ github.sha }}`

      - name: Notify successful deployment
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail --silent --show-error -X POST "${DISCORD_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Deployment \\\`${CONTAINER_NAME}\\\` completed: \\\`${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}\\\`\"}"

      - name: Notify failed deployment
        if: failure() && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail --silent --show-error -X POST "${DISCORD_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Deployment \\\`${CONTAINER_NAME}\\\` failed. Check ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Log out from GHCR
        if: always()
        run: container registry logout ghcr.io || true
